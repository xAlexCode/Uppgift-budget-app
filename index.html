<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fed25d-js-inl-2-budget-app-xalexcode</title>
  </head>

  <body>
    <header>
      <nav>
        <h1>CashCat</h1>
        <button id="meny">Meny</button>
      </nav>
    </header>

    <main>
      <div>
        <p>
          Räkna ut din månadsbalans enkelt med CashCat. Mata in inkomster och utgifter för att få en sammanställning av
          balansen denna månad.
        </p>
      </div>

      <section>
        <h2>Inkomster</h2>
        <form id="incomeForm">
          <div class="form-group">
            <label>
              <span>Beskrivning</span>
              <input id="incomeDescription" name="income-description" type="text" required />
            </label>

            <label>
              <span>Belopp</span>
              <input id="incomeAmount" name="income-amount" type="number" required />
            </label>

            <label>
              <span>Välj Kategori</span>
              <select id="incomeCategory">
                <option value="" disabled selected>Välj kategori</option>
              </select>
            </label>

            <button id="saveIncomeBtn" type="button">Spara inkomst</button>
          </div>
        </form>
      </section>

      <section>
        <h2>Utgifter</h2>
        <form id="expenseForm">
          <div class="form-group">
            <label>
              <span>Beskrivning</span>
              <input id="expenseDescription" name="expense-description" type="text" required />
            </label>

            <label>
              <span>Belopp</span>
              <input id="expenseAmount" name="expense-amount" type="number" required />
            </label>

            <label>
              <span>Välj Kategori</span>
              <select id="expenseCategory">
                <option value="" disabled selected>Välj kategori</option>
              </select>
            </label>

            <button id="saveExpenseBtn" type="button">Spara utgift</button>
          </div>
        </form>

        <section>
          <div id="balanceCard">
            <h2>Balans</h2>
            <div id="listContainer"></div>
            <p id="balanceValue">Totalt: 0 kr</p>
          </div>
        </section>
      </section>
    </main>
    <footer>@xAlexCode 2026</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
